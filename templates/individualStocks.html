<!doctype html>
<html lang="en">
  <head>
    <title>Individuals</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/basicStyle.css') }}">
  </head>

    <header>
        <h1>Overview Individual Stocks</h1>
    </header>
  <body>

    <div class="button-div">
      <a href="{{ url_for('index') }}"><button class="navigation-button">Home</button></a>
    </div>

    {% for graph, news in pairs %}
        <div class="container">
            <div class="left-side">

                {{ graph|safe }}

            </div>
                
            <div class="right-side">
                <div class="article">
                    {% for item in news %}

                        <p class="headline">
                            <h2><a href="{{ item.link }}">{{ item.title }}</a></h2>
                            <p>{{ item.published }}</p>
                        </p>

                    {% endfor %}
                </div>

            <div class="container">
                <div class="left-side">
                    <div class="button-div">
                    <a href="{{ url_for('index') }}"><button class="sell-button">SELL</button></a>
                    </div>
                </div>
                <div class="right-side">
                    <div class="button-div">
                    <a href="{{ url_for('index') }}"><button class="buy-button">BUY</button></a>
                    </div>
                </div>
            </div>    

            </div>
        </div>

    {% endfor %}

  </body>
</html>
